name: Build & Verify Catalog PDF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install reportlab pillow

      - name: Verify catalog generation & PDF
        run: |
          python scripts/analyze_fabric_tags.py
          python scripts/generate_catalog.py
          python scripts/generate_pdf_catalog.py
